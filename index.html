<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compleanno Sara ✨ 18th</title>
    <style>
        :root {
            --bg-color: #F9F3F0;
            --card-bg: #FFFFFF;
            --primary: #C59B93;
            --primary-dark: #A87D75;
            --text-main: #4A3B32;
            --text-muted: #9E7B70;
            --border-color: #EED7D3;
            --error-color: #D97777;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
            flex: 1;
        }

        /* Schermata Login PIN */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
            z-index: 100;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(180, 140, 140, 0.15);
            text-align: center;
            maxWidth: 400px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--primary-dark);
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 18px;
            text-align: center;
            outline: none;
            background-color: #FAF6F5;
            color: var(--text-main);
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        button, .upload-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--primary);
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(197, 155, 147, 0.3);
            display: inline-block;
            box-sizing: border-box;
            text-align: center;
            transition: background 0.2s;
        }

        button:hover, .upload-btn:hover {
            background-color: var(--primary-dark);
        }

        .error {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        /* App Principale */
        #app-screen {
            display: none;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .upload-btn {
            width: auto;
            padding: 12px 24px;
            font-size: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .photo-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(180, 140, 140, 0.1);
            border: 1px solid var(--border-color);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- SCHERMATA PIN -->
    <div id="login-screen">
        <div class="card">
            <h1>Compleanno Sara ✨</h1>
            <p>Inserisci il PIN per accedere ai ricordi della festa</p>
            <input type="password" id="pin-input" maxlength="4" placeholder="PIN (es. 1818)">
            <button onclick="checkPin()">Entra</button>
            <div id="error-msg" class="error">PIN errato, riprova!</div>
        </div>
    </div>

    <!-- SCHERMATA PRINCIPALE (GALLERIA) -->
    <div id="app-screen" class="container">
        <header>
            <h1>Compleanno Sara 🥂 18th</h1>
            <label class="upload-btn" id="upload-label">
                📷 Carica Foto
                <input type="file" id="file-input" accept="image/*" onchange="uploadPhoto(event)">
            </label>
        </header>

        <div id="loading" class="loading-text">Caricamento ricordi in corso...</div>
        <div class="grid" id="photo-grid"></div>
    </div>

    <!-- FIREBASE SDKs (Tramite CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        // Configurazione Firebase ufficiale
        const firebaseConfig = {
            apiKey: "AIzaSyDzsK0ahLujhQfkOZs1AfxArsWOr0_la3o",
            authDomain: "compleanno-sara-b1b27.firebaseapp.com",
            projectId: "compleanno-sara-b1b27",
            storageBucket: "compleanno-sara-b1b27.firebasestorage.app",
            messagingSenderId: "471627524163",
            appId: "1:471627524163:web:ed3dbe0532a0c4cb638cf6",
            measurementId: "G-SWGHVCWCBM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const CORRECT_PIN = "1818";

        window.checkPin = function() {
            const enteredPin = document.getElementById("pin-input").value;
            if (enteredPin === CORRECT_PIN) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-screen").style.display = "block";
                loadPhotos();
            } else {
                document.getElementById("error-msg").style.display = "block";
                document.getElementById("pin-input").value = "";
            }
        };

        window.loadPhotos = async function() {
            const grid = document.getElementById("photo-grid");
            const loading = document.getElementById("loading");
            try {
                const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                grid.innerHTML = "";
                loading.style.display = "none";

                if (querySnapshot.empty) {
                    grid.innerHTML = '<div class="empty-state">Nessuna foto caricata ancora. Sii la prima/o! 💖</div>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement("div");
                    card.className = "photo-card";
                    card.innerHTML = `<img src="${data.imageUrl}" alt="Ricordo festa">`;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Errore nel caricamento:", err);
                loading.innerText = "Errore nel caricamento delle foto.";
            }
        };

        window.uploadPhoto = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadLabel = document.getElementById("upload-label");
            uploadLabel.innerText = "Caricamento...";

            const reader = new FileReader();
            reader.onloadend = async function() {
                try {
                    await addDoc(collection(db, "photos"), {
                        imageUrl: reader.result,
                        createdAt: new Date()
                    });
                    loadPhotos();
                } catch (err) {
                    console.error("Errore salvataggio:", err);
                    alert("Errore durante il caricamento della foto.");
                } finally {
                    uploadLabel.innerHTML = "📷 Carica Foto <input type='file' id='file-input' accept='image/*' onchange='uploadPhoto(event)'>";
                }
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
