<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compleanno Sara ✨ 18th</title>
    <style>
        :root {
            --bg-color: #F9F3F0;
            --card-bg: #FFFFFF;
            --primary: #C59B93;
            --primary-dark: #A87D75;
            --text-main: #4A3B32;
            --text-muted: #9E7B70;
            --border-color: #EED7D3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            box-shadow: 0 0 20px rgba(180, 140, 140, 0.1);
        }

        header {
            padding: 24px 20px 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: var(--primary-dark);
            font-size: 22px;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .admin-trigger {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            background-color: #FAF6F5;
        }

        .upload-container {
            width: 100%;
        }

        .upload-btn {
            background-color: var(--primary);
            color: #FFFFFF;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(197, 155, 147, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, background-color 0.2s;
            box-sizing: border-box;
        }

        .upload-btn:active {
            transform: scale(0.98);
        }

        .upload-btn:hover {
            background-color: var(--primary-dark);
        }

        input[type="file"] {
            display: none;
        }

        .feed {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .photo-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(180, 140, 140, 0.12);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .photo-card img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            display: block;
        }

        .photo-footer {
            padding: 12px 16px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 60px;
            padding: 0 20px;
            font-size: 15px;
            line-height: 1.5;
        }

        .loading-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-style: italic;
            font-size: 14px;
        }

        /* Modale PIN */
        #admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(74, 59, 50, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 24px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border: 1px solid var(--border-color);
        }

        .modal-card h3 {
            color: var(--primary-dark);
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .modal-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .modal-card input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            background: #FAF6F5;
            color: var(--text-main);
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-cancel {
            background: #F1E5E1;
            color: var(--text-muted);
        }

        .btn-confirm {
            background: var(--primary);
            color: white;
        }

        .error-msg {
            color: #D97777;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
    </style>
    <!-- Libreria ZIP per Sara -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-top">
                <h1>Compleanno Sara 🥂 18th</h1>
                <button class="admin-trigger" onclick="openAdminModal()">🔒 Area Sara</button>
            </div>
            <div class="upload-container">
                <label class="upload-btn" id="upload-btn-label">
                    📷 Scatta o Carica Foto
                    <input type="file" id="file-input" accept="image/*" onchange="compressAndUpload(event)">
                </label>
            </div>
        </header>

        <div class="feed" id="photo-feed">
            <div id="loading" class="loading-state">Caricamento ricordi... ✨</div>
        </div>
    </div>

    <!-- MODALE PIN SEGRETO -->
    <div id="admin-modal">
        <div class="modal-card">
            <h3>Area Festeggiata</h3>
            <p>Inserisci il PIN per scaricare l'archivio ZIP con tutte le foto</p>
            <input type="password" id="admin-pin" maxlength="4" placeholder="••••">
            <div id="pin-error" class="error-msg">PIN non corretto</div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeAdminModal()">Chiudi</button>
                <button class="modal-btn btn-confirm" onclick="verifyAdminPin()">Entra</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE E LOGICA SMART -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzsK0ahLujhQfkOZs1AfxArsWOr0_la3o",
            authDomain: "compleanno-sara-b1b27.firebaseapp.com",
            projectId: "compleanno-sara-b1b27",
            storageBucket: "compleanno-sara-b1b27.firebasestorage.app",
            messagingSenderId: "471627524163",
            appId: "1:471627524163:web:ed3dbe0532a0c4cb638cf6",
            measurementId: "G-SWGHVCWCBM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const CORRECT_PIN = "1818";
        let cachedPhotos = [];

        // Caricamento feed foto in tempo reale per tutti
        window.loadPhotos = async function() {
            const feed = document.getElementById("photo-feed");
            const loading = document.getElementById("loading");
            try {
                const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                feed.innerHTML = "";
                cachedPhotos = [];

                if (querySnapshot.empty) {
                    feed.innerHTML = '<div class="empty-state">Ancora nessuna foto! Rompi il ghiaccio e carica il primo ricordo della festa 💖</div>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    cachedPhotos.push(data.imageUrl);
                    const card = document.createElement("div");
                    card.className = "photo-card";
                    card.innerHTML = `
                        <img src="${data.imageUrl}" alt="Foto festa" loading="lazy">
                        <div class="photo-footer">
                            <span>✨ Ricordo di gruppo</span>
                            <span>${new Date().toLocaleDateString()}</span>
                        </div>
                    `;
                    feed.appendChild(card);
                });
            } catch (err) {
                console.error("Errore caricamento:", err);
                if(loading) loading.innerText = "Impossibile caricare le foto. Controlla la connessione.";
            }
        };

        // Funzione magica: comprime l'immagine prima di caricarla per azzerare il peso ed evitare errori
        window.compressAndUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadLabel = document.getElementById("upload-btn-label");
            uploadLabel.innerText = "Ottimizzazione foto...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000;
                    const MAX_HEIGHT = 1000;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Comprime al 75% di qualità per renderla leggerissima ma bellissima
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);

                    uploadLabel.innerText = "Caricamento in corso...";
                    try {
                        await addDoc(collection(db, "photos"), {
                            imageUrl: compressedDataUrl,
                            createdAt: new Date()
                        });
                        loadPhotos();
                    } catch (err) {
                        console.error("Errore salvataggio:", err);
                        alert("Caricamento non riuscito. Riprova.");
                    } finally {
                        uploadLabel.innerHTML = `📷 Scatta o Carica Foto <input type='file' id='file-input' accept='image/*' onchange='compressAndUpload(event)'>`;
                    }
                }
            };
        };

        // Gestione PIN Sara
        window.openAdminModal = function() {
            document.getElementById("admin-modal").style.display = "flex";
            document.getElementById("admin-pin").value = "";
            document.getElementById("pin-error").style.display = "none";
        };

        window.closeAdminModal = function() {
            document.getElementById("admin-modal").style.display = "none";
        };

        window.verifyAdminPin = async function() {
            const enteredPin = document.getElementById("admin-pin").value;
            if (enteredPin === CORRECT_PIN) {
                closeAdminModal();
                alert("PIN corretto! Preparazione dell'archivio ZIP...");
                await downloadAllAsZip();
            } else {
                document.getElementById("pin-error").style.display = "block";
            }
        };

        // Download archivio ZIP
        async function downloadAllAsZip() {
            if (cachedPhotos.length === 0) {
                alert("Non ci sono foto da scaricare!");
                return;
            }
            const zip = new JSZip();
            const folder = zip.folder("Compleanno-Sara-Ricordi");

            cachedPhotos.forEach((url, index) => {
                const base64Data = url.split(',')[1];
                if (base64Data) {
                    folder.file(`Sara_18_${index + 1}.jpg`, base64Data, { base64: true });
                }
            });

            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = "Compleanno-Sara-Tutte-Le-Foto.zip";
            link.click();
        }

        loadPhotos();
    </script>
</body>
</html>
