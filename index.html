<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compleanno Sara ✨ 18th</title>
    <style>
        :root {
            --bg-color: #F9F3F0;
            --card-bg: #FFFFFF;
            --primary: #C59B93;
            --primary-dark: #A87D75;
            --text-main: #4A3B32;
            --text-muted: #9E7B70;
            --border-color: #EED7D3;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
            flex: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--primary-dark);
            font-size: 26px;
            margin: 0;
            font-weight: 600;
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: #FFFFFF;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            fontWeight: 600;
            border: none;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(197, 155, 147, 0.3);
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        input[type="file"] {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .photo-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(180, 140, 140, 0.1);
            border: 1px solid var(--border-color);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 16px;
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            margin-top: 20px;
            font-style: italic;
        }

        /* Modale PIN per la Festeggiata */
        #admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(74, 59, 50, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 350px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        .modal-card input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            text-align: center;
            margin: 15px 0;
            outline: none;
            box-sizing: border-box;
            background: #FAF6F5;
            color: var(--text-main);
        }

        .error-msg {
            color: #D97777;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
    <!-- Libreria per scaricare lo ZIP delle foto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Compleanno Sara 🥂 18th</h1>
            <div class="actions-bar">
                <label class="btn" id="upload-btn-label">
                    📷 Carica Foto
                    <input type="file" id="file-input" accept="image/*" onchange="uploadPhoto(event)">
                </label>
                <!-- Pulsante Riservato alla Festeggiata -->
                <button class="btn" style="background-color: #9E7B70;" onclick="openAdminModal()">🔒 Area Sara</button>
            </div>
        </header>

        <div id="loading" class="loading-text">Caricamento ricordi in corso...</div>
        <div class="grid" id="photo-grid"></div>
    </div>

    <!-- MODALE INSERIMENTO PIN -->
    <div id="admin-modal">
        <div class="modal-card">
            <h3 style="color: var(--primary-dark); margin-top:0;">Area Festeggiata</h3>
            <p style="color: var(--text-muted); font-size: 13px;">Inserisci il PIN per scaricare tutte le foto in formato ZIP</p>
            <input type="password" id="admin-pin" maxlength="4" placeholder="PIN (es. 1818)">
            <div id="pin-error" class="error-msg">PIN errato!</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" style="flex:1; background-color: #D97777;" onclick="closeAdminModal()">Annulla</button>
                <button class="btn" style="flex:1;" onclick="verifyAdminPin()">Conferma</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & LOGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzsK0ahLujhQfkOZs1AfxArsWOr0_la3o",
            authDomain: "compleanno-sara-b1b27.firebaseapp.com",
            projectId: "compleanno-sara-b1b27",
            storageBucket: "compleanno-sara-b1b27.firebasestorage.app",
            messagingSenderId: "471627524163",
            appId: "1:471627524163:web:ed3dbe0532a0c4cb638cf6",
            measurementId: "G-SWGHVCWCBM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const CORRECT_PIN = "1818";
        let cachedPhotos = [];

        // Caricamento foto automatico all'apertura per TUTTI gli invitati
        window.loadPhotos = async function() {
            const grid = document.getElementById("photo-grid");
            const loading = document.getElementById("loading");
            try {
                const q = query(collection(db, "photos"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                grid.innerHTML = "";
                loading.style.display = "none";
                cachedPhotos = [];

                if (querySnapshot.empty) {
                    grid.innerHTML = '<div class="empty-state">Nessuna foto caricata ancora. Sii la prima/o a rompere il ghiaccio! 💖</div>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    cachedPhotos.push(data.imageUrl);
                    const card = document.createElement("div");
                    card.className = "photo-card";
                    card.innerHTML = `<img src="${data.imageUrl}" alt="Ricordo festa">`;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Errore nel caricamento:", err);
                loading.innerText = "Impossibile caricare le foto. Controlla la connessione.";
            }
        };

        // Funzione upload foto ottimizzata per evitare errori di invio
        window.uploadPhoto = async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadLabel = document.getElementById("upload-btn-label");
            uploadLabel.innerText = "Caricamento in corso...";

            const reader = new FileReader();
            reader.onloadend = async function() {
                try {
                    await addDoc(collection(db, "photos"), {
                        imageUrl: reader.result,
                        createdAt: new Date()
                    });
                    loadPhotos();
                } catch (err) {
                    console.error("Errore salvataggio:", err);
                    alert("Caricamento non riuscito. La foto potrebbe essere troppo pesante, prova con un'altra.");
                } finally {
                    uploadLabel.innerHTML = `📷 Carica Foto <input type='file' id='file-input' accept='image/*' onchange='uploadPhoto(event)'>`;
                }
            };
            reader.readAsDataURL(file);
        };

        // Gestione PIN Festeggiata
        window.openAdminModal = function() {
            document.getElementById("admin-modal").style.display = "flex";
            document.getElementById("admin-pin").value = "";
            document.getElementById("pin-error").style.display = "none";
        };

        window.closeAdminModal = function() {
            document.getElementById("admin-modal").style.display = "none";
        };

        window.verifyAdminPin = async function() {
            const enteredPin = document.getElementById("admin-pin").value;
            if (enteredPin === CORRECT_PIN) {
                closeAdminModal();
                alert("PIN corretto! Preparazione dell'archivio ZIP con tutte le foto in corso...");
                await downloadAllAsZip();
            } else {
                document.getElementById("pin-error").style.display = "block";
            }
        };

        // Download ZIP per Sara
        async function downloadAllAsZip() {
            if (cachedPhotos.length === 0) {
                alert("Non ci sono foto da scaricare al momento!");
                return;
            }
            const zip = new JSZip();
            const folder = zip.folder("Compleanno-Sara-Ricordi");

            cachedPhotos.forEach((url, index) => {
                // Estrae i dati binari dall'immagine in base64
                const base64Data = url.split(',')[1];
                if (base64Data) {
                    folder.file(`foto_${index + 1}.jpg`, base64Data, { base64: true });
                }
            });

            const content = await zip.generateAsync({ type: "blob" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = "Compleanno-Sara-Foto.zip";
            link.click();
        }

        // Avvia il caricamento galleria all'avvio
        loadPhotos();
    </script>
</body>
</html>
